spring.application.name=solar-watch
server.port=${PORT:8080}

openweather.geocoding.base-url=https://api.openweathermap.org
openweather.api-key=${OPENWEATHER_API_KEY}

# sunrise-sunset.org API
sunrisesunset.base-url=https://api.sunrise-sunset.org

# Logging
logging.level.com.codecool.solarwatch=DEBUG

# H2
#spring.h2.console.enabled=true

# PostGres
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:postgresql://localhost:5432/solarwatch
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.show-sql=true

# Secret
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD}